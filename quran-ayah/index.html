<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Ayah</title>
  <meta name="description" content="A random ayah from a selection of the Holy Quran with translation and recitation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ec;
      --card: #fffdf8;
      --text: #1f2a24;
      --muted: #6b7570;
      --accent: #1f6f50;
      --accent-text: #ffffff;
      --border: #e4ddcd;
      --shadow: 0 10px 30px rgba(31, 42, 36, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111714;
        --card: #18201c;
        --text: #e9efe9;
        --muted: #9aa69f;
        --accent: #4fb98c;
        --accent-text: #0d1310;
        --border: #2a3530;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #111714;
      --card: #18201c;
      --text: #e9efe9;
      --muted: #9aa69f;
      --accent: #4fb98c;
      --accent-text: #0d1310;
      --border: #2a3530;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }
    header, main, footer { width: 100%; max-width: 760px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    select, button {
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }
    .ref {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 20px;
    }
    .ref strong { color: var(--accent); font-weight: 600; }
    .arabic {
      font-family: "Amiri Quran", "Amiri", serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 2.3;
      text-align: center;
      direction: rtl;
      margin: 0 0 24px;
    }
    .translation {
      font-size: 1.05rem;
      text-align: center;
      margin: 0;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .translator { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 8px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }
    .primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 600;
      padding: 10px 20px;
    }
    .picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
    .picks button { font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; color: var(--muted); }
    .picks button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .status { text-align: center; color: var(--muted); min-height: 1.5em; margin-top: 12px; font-size: 0.9rem; }
    .loading .arabic, .loading .translation { opacity: 0.35; transition: opacity 0.2s; }

    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 32px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Random Ayah</h1>
    <select id="lang" aria-label="Translation language">
      <option value="bs.korkut">Bosanski (Korkut)</option>
      <option value="en.sahih">English (Saheeh International)</option>
      <option value="bs.mlivo">Bosanski (Mlivo)</option>
      <option value="tr.diyanet">Türkçe (Diyanet)</option>
      <option value="de.aburida">Deutsch (Abu Rida)</option>
      <option value="fr.hamidullah">Français (Hamidullah)</option>
    </select>
  </header>

  <main>
    <article class="card" id="card" aria-live="polite">
      <div class="ref" id="ref">Loading…</div>
      <p class="arabic" id="arabic"></p>
      <p class="translation" id="translation"></p>
      <div class="translator" id="translator"></div>
    </article>

    <div class="actions">
      <button class="primary" id="next">New ayah</button>
      <button id="play" disabled>▶ Listen</button>
      <button id="copy" disabled>Copy</button>
      <button id="share" disabled>Share link</button>
    </div>
    <nav class="picks" id="picks" aria-label="Choose an ayah"></nav>
    <div class="status" id="status"></div>
    <audio id="audio" preload="none"></audio>
  </main>

  <footer>
    Text, translations and recitation (Mishary Alafasy) via
    <a href="https://alquran.cloud/api" target="_blank" rel="noopener">AlQuran Cloud</a>.
    <span id="qlink"></span>
  </footer>

  <script>
    // The selection of ayahs the page picks from: [surah, ayah, label]
    const AYAHS = [
      [4, 136, "En-Nisa 136"],
      [16, 89, "En-Nahl 89"],
      [30, 30, "Er-Rum 30"],
      [3, 85, "Ali Imran 85"],
      [7, 172, "El-A'raf 172"],
    ];
    const API = "https://api.alquran.cloud/v1/ayah/";
    const $ = (id) => document.getElementById(id);
    const audio = $("audio");
    let current = null;

    function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function storageSet(key, val) { try { localStorage.setItem(key, val); } catch {} }

    const savedLang = storageGet("ayah-lang");
    if (savedLang && [...$("lang").options].some(o => o.value === savedLang)) $("lang").value = savedLang;

    const refOf = ([s, a]) => `${s}:${a}`;

    function ayahFromHash() {
      const ref = location.hash.slice(1);
      return AYAHS.some(x => refOf(x) === ref) ? ref : null;
    }

    // Random pick from the selection, never repeating the one on screen
    function randomAyah() {
      const pool = AYAHS.map(refOf).filter(r => !current || r !== current.number);
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return pool[buf[0] % pool.length];
    }

    AYAHS.forEach((x) => {
      const b = document.createElement("button");
      b.textContent = x[2];
      b.dataset.ref = refOf(x);
      b.addEventListener("click", () => load(b.dataset.ref));
      $("picks").append(b);
    });

    function setStatus(msg) { $("status").textContent = msg; }

    async function load(number) {
      $("card").classList.add("loading");
      setStatus("");
      audio.pause();
      $("play").textContent = "▶ Listen";
      const translation = $("lang").value;
      try {
        const res = await fetch(`${API}${number}/editions/quran-uthmani,${translation},ar.alafasy`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const [ar, tr, rec] = json.data;
        current = { number, ar, tr, audio: rec.audio };
        render();
        history.replaceState(null, "", `#${number}`);
        document.querySelectorAll("#picks button").forEach(b =>
          b.setAttribute("aria-pressed", String(b.dataset.ref === number)));
      } catch (err) {
        $("ref").textContent = "Could not load the ayah.";
        setStatus("Check your connection and press “New ayah” to try again.");
        console.error(err);
      } finally {
        $("card").classList.remove("loading");
      }
    }

    function render() {
      const { ar, tr } = current;
      const s = ar.surah;
      $("ref").innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = `${s.englishName} (${s.name})`;
      $("ref").append(strong, ` · ${s.englishNameTranslation} · Surah ${s.number}, Ayah ${ar.numberInSurah} · Juz ${ar.juz}`);
      $("arabic").textContent = ar.text;
      $("translation").textContent = tr.text;
      $("translator").textContent = tr.edition.englishName;
      audio.src = current.audio;
      ["play", "copy", "share"].forEach(id => $(id).disabled = false);
      $("qlink").innerHTML = "";
      const a = document.createElement("a");
      a.href = `https://quran.com/${s.number}/${ar.numberInSurah}`;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Open on quran.com";
      $("qlink").append(" · ", a);
    }

    function refText() {
      const { ar, tr } = current;
      return `${ar.text}\n\n${tr.text}\n\n— ${ar.surah.englishName} ${ar.surah.number}:${ar.numberInSurah}`;
    }

    $("next").addEventListener("click", () => load(randomAyah()));
    $("lang").addEventListener("change", () => {
      storageSet("ayah-lang", $("lang").value);
      if (current) load(current.number);
    });
    $("play").addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => setStatus("Audio could not be played."));
        $("play").textContent = "❚❚ Pause";
      } else {
        audio.pause();
        $("play").textContent = "▶ Listen";
      }
    });
    audio.addEventListener("ended", () => { $("play").textContent = "▶ Listen"; });
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(refText()); setStatus("Copied to clipboard."); }
      catch { setStatus("Copy failed."); }
    });
    $("share").addEventListener("click", async () => {
      const url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: "Ayah of the moment", text: refText(), url }); } catch {}
      } else {
        try { await navigator.clipboard.writeText(url); setStatus("Link copied."); }
        catch { setStatus(url); }
      }
    });
    window.addEventListener("hashchange", () => {
      const n = ayahFromHash();
      if (n && (!current || current.number !== n)) load(n);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === " " && e.target === document.body) { e.preventDefault(); load(randomAyah()); }
    });

    load(ayahFromHash() || randomAyah());
  </script>
</body>
</html>
