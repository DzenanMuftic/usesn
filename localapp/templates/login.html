<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persons — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:40px;width:100%;max-width:380px}
  h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:8px}
  p.sub{color:#666;font-size:.9rem;margin-bottom:28px}
  label{display:block;font-size:.85rem;font-weight:600;color:#333;margin-bottom:6px}
  input[type=password]{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:6px;font-size:1rem;outline:none;transition:border .2s}
  input[type=password]:focus{border-color:#4f46e5}
  button{width:100%;margin-top:18px;padding:11px;background:#4f46e5;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
  button:hover{background:#3730a3}
  .flash{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <h1>Persons Portal</h1>
  <p class="sub">ServiceNow ↔ PostgreSQL</p>
  {% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus placeholder="Enter password">
    <button type="submit">Log in</button>
  </form>
</div>
</body>
</html>
